<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <style>
    :root{

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

    .hero-label{font-size:13px;opacity:.82}.hero-value{font-size:34px;font-weight:850;letter-spacing:-1px;margin:8px 0 18px}.hero-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hero-stat{background:rgba(255,255,255,.13);padding:11px 12px;border-radius:15px}.hero-stat span{display:block;font-size:11px;opacity:.78;margin-bottom:4px}.hero-stat b{font-size:15px}
    .quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.quick button{border:0;border-radius:18px;padding:15px 12px;font-weight:800;font-size:15px;box-shadow:var(--shadow)}.expense-btn{background:var(--card);color:var(--danger)}.income-btn{background:var(--card);color:var(--success)}
    .section{margin-top:18px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}.section-title{font-size:17px;font-weight:800;letter-spacing:-.2px}.link-btn{border:0;background:none;color:var(--link);font-size:13px;font-weight:700;padding:6px}
    .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.kpi{background:var(--card);border-radius:18px;padding:13px 11px;box-shadow:var(--shadow);min-width:0}.kpi .label{font-size:10px;color:var(--muted);margin-bottom:7px}.kpi .value{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.positive{color:var(--success)}.negative{color:var(--danger)}
    .credit-mini{display:flex;gap:13px;align-items:center}.credit-icon{width:46px;height:46px;border-radius:15px;background:color-mix(in srgb,var(--accent) 14%,transparent);display:flex;align-items:center;justify-content:center;font-size:22px}.grow{flex:1;min-width:0}.title{font-weight:800}.sub{font-size:12px;color:var(--muted);margin-top:4px}.amount{font-weight:850;white-space:nowrap}
    .bank-logo{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.10)}.bank-logo svg{width:72%;height:72%;display:block}.bank-logo.sm{width:40px;height:40px;border-radius:13px}.bank-logo.xs{width:34px;height:34px;border-radius:11px}.bank-sber{background:#21a038}.bank-tbank{background:#ffdd2d}.bank-vtb{background:#0a5bd8}.bank-alfa{background:#ef3124}.bank-gazprom{background:#0077c8}.bank-sovcom{background:#e32636}.bank-rshb{background:#14804a}.bank-psb{background:#ef6c24}.bank-mkb{background:#bd1f2d}.bank-raif{background:#ffe600}.bank-pochta{background:#1d58a8}.bank-ozon{background:#005bff}.bank-yandex{background:#ffcc00}.bank-other{background:color-mix(in srgb,var(--text) 20%,var(--card))}.credit-brand-row{display:flex;align-items:center;gap:11px;min-width:0}.credit-brand-row>div:last-child{min-width:0}.credit-card-head .credit-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
    .bank-picker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-height:225px;overflow:auto;padding:2px 1px 6px;scrollbar-width:none}.bank-choice{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}.bank-choice span{font-size:10px;font-weight:750;line-height:1.15;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}.bank-choice.selected{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 24%,transparent)}.bank-choice.selected span{color:var(--link)}

    .tx-list{display:flex;flex-direction:column;gap:8px}.tx{display:flex;align-items:center;gap:11px;background:var(--card);border-radius:17px;padding:11px 12px;box-shadow:0 3px 14px rgba(0,0,0,.04)}.tx-icon{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--accent) 10%,transparent);font-size:19px}.tx-main{flex:1;min-width:0}.tx-title{font-size:14px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tx-sub{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tx-amount{text-align:right;font-weight:850;font-size:14px}.delete-mini{border:0;background:none;color:var(--muted);font-size:15px;padding:8px 0 8px 7px}
    .page{display:none}.page.active{display:block}
    .filter-row{display:flex;gap:8px;overflow:auto;padding-bottom:4px;scrollbar-width:none}.chip{border:0;border-radius:999px;background:var(--card);color:var(--text);padding:9px 13px;font-size:12px;font-weight:700;white-space:nowrap}.chip.active{background:var(--accent);color:var(--accent-text)}
    .search{width:100%;border:0;background:var(--card);color:var(--text);border-radius:16px;padding:13px 14px;outline:none;margin:10px 0 12px;box-shadow:var(--shadow)}
    .chart-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:10px}.chart-title{font-weight:800;margin-bottom:14px}.bars{height:150px;display:flex;align-items:flex-end;gap:8px}.bar-col{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;min-width:0}.bar-pair{width:100%;flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px}.bar{width:36%;min-width:7px;border-radius:6px 6px 2px 2px;background:var(--accent);min-height:2px}.bar.exp{background:var(--danger)}.bar-label{font-size:9px;color:var(--muted);white-space:nowrap}.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:10px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--accent)}.dot.red{background:var(--danger)}
    .cat-row{display:grid;grid-template-columns:minmax(90px,1.4fr) 2fr auto;gap:9px;align-items:center;margin:10px 0}.cat-name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cat-bar{height:8px;background:color-mix(in srgb,var(--text) 8%,transparent);border-radius:8px;overflow:hidden}.cat-bar i{display:block;height:100%;background:var(--accent);border-radius:8px}.cat-value{font-size:11px;font-weight:700;white-space:nowrap}
    .credit-card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-bottom:10px}.credit-card-head{display:flex;justify-content:space-between;gap:12px}.credit-name{font-size:16px;font-weight:850}.credit-bal{font-size:16px;font-weight:850}.credit-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.meta{background:color-mix(in srgb,var(--text) 4%,transparent);border-radius:13px;padding:10px}.meta span{display:block;font-size:9px;color:var(--muted);margin-bottom:4px}.meta b{font-size:12px}.credit-actions{display:flex;gap:8px;margin-top:13px}.small-btn{flex:1;border:0;border-radius:13px;padding:10px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--link);font-weight:800;font-size:12px}.small-btn.primary{background:var(--accent);color:var(--accent-text)}
    .account{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.account:last-child{border-bottom:0}.account-icon{width:40px;height:40px;border-radius:13px;background:color-mix(in srgb,var(--accent) 12%,transparent);display:flex;align-items:center;justify-content:center}.star{color:#f2b01e}.account-actions{display:flex;align-items:center;gap:4px}
    .rec{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.rec:last-child{border-bottom:0}.switch{width:42px;height:24px;border:0;border-radius:99px;background:color-mix(in srgb,var(--text) 14%,transparent);padding:3px}.switch i{display:block;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.switch.on{background:var(--success)}.switch.on i{transform:translateX(18px)}
    .add-wide{width:100%;border:1px dashed color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 7%,transparent);color:var(--link);border-radius:16px;padding:12px;font-weight:800;margin-top:10px}
    .empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:13px}.empty .emoji{font-size:32px;margin-bottom:8px}
    .bottom{position:fixed;z-index:30;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:7px max(8px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}.nav{max-width:680px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:none;color:var(--muted);padding:6px 2px;font-size:10px;font-weight:700}.nav button b{display:block;font-size:20px;margin-bottom:2px;filter:grayscale(1);opacity:.7}.nav button.active{color:var(--accent)}.nav button.active b{filter:none;opacity:1}
    .modal-wrap{position:fixed;z-index:60;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center}.modal-wrap.open{display:flex}.modal{background:var(--bg);width:min(680px,100%);max-height:91vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}@keyframes up{from{transform:translateY(20px);opacity:.7}to{transform:none;opacity:1}}.grab{width:42px;height:4px;border-radius:5px;background:color-mix(in srgb,var(--text) 20%,transparent);margin:0 auto 15px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-title{font-size:19px;font-weight:850}.close{border:0;background:var(--card);color:var(--text);border-radius:12px;width:36px;height:36px}.field{margin-bottom:12px}.field label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin:0 0 6px 4px}.field input,.field select{width:100%;border:0;outline:none;background:var(--card);color:var(--text);border-radius:15px;padding:13px 14px;box-shadow:0 2px 12px rgba(0,0,0,.03)}.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.submit{width:100%;border:0;border-radius:16px;padding:14px;background:var(--accent);color:var(--accent-text);font-weight:850;font-size:15px;margin-top:4px}.danger-btn{background:var(--danger);color:#fff}
    .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);padding:4px;border-radius:15px;margin-bottom:14px}.seg button{border:0;background:none;color:var(--muted);border-radius:11px;padding:10px;font-weight:800}.seg button.active{background:var(--accent);color:var(--accent-text)}
    .toast{position:fixed;z-index:100;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:10px 14px;border-radius:14px;font-size:12px;opacity:0;pointer-events:none;transition:.22s;max-width:85%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .loader{position:fixed;z-index:120;inset:0;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center}.spinner{width:36px;height:36px;border:4px solid color-mix(in srgb,var(--accent) 22%,transparent);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .fatal{padding:35px 20px;text-align:center}.fatal .big{font-size:42px}.fatal h2{margin:10px 0 8px}.fatal p{color:var(--muted);line-height:1.5;font-size:13px}
    @media(max-width:370px){.hero-value{font-size:29px}.credit-meta{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr}.kpi{display:flex;justify-content:space-between;align-items:center}.kpi .label{margin:0}}
  </style>
</head>
<body>
  <div id="loader" class="loader"><div class="spinner"></div></div>
  <main id="app" class="app" style="display:none">
    <div class="topbar">
      <div><div class="hello" id="hello">Финансы</div><div class="name" id="username">FinanceBot</div></div>
      <button class="icon-btn" id="refreshBtn" aria-label="Обновить">↻</button>
    </div>

    <section class="page active" data-page="home" id="page-home"></section>
    <section class="page" data-page="operations" id="page-operations"></section>
    <section class="page" data-page="analytics" id="page-analytics"></section>
    <section class="page" data-page="credits" id="page-credits"></section>
    <section class="page" data-page="more" id="page-more"></section>
  </main>

  <nav class="bottom" id="bottomNav" style="display:none">
    <div class="nav">
      <button class="active" data-nav="home"><b>🏠</b>Главная</button>
      <button data-nav="operations"><b>💸</b>Операции</button>
      <button data-nav="analytics"><b>📊</b>Аналитика</button>
      <button data-nav="credits"><b>💳</b>Кредиты</button>
      <button data-nav="more"><b>⚙️</b>Ещё</button>
    </div>
  </nav>

  <div class="modal-wrap" id="modalWrap"><div class="modal" id="modal"></div></div>
  <div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  function getTelegramInitData(){
    let v = tg ? String(tg.initData || '') : '';
    try {
      if (!v) {
        const hp = new URLSearchParams(String(location.hash || '').replace(/^#/,''));
        v = hp.get('tgWebAppData') || '';
      }
      if (!v) {
        const qp = new URLSearchParams(location.search || '');
        v = qp.get('tgWebAppData') || '';
      }
      if (v) sessionStorage.setItem('financebot_init_data', v);
      if (!v) v = sessionStorage.getItem('financebot_init_data') || '';
    } catch(e) {}
    return v;
  }
  const INIT_DATA = getTelegramInitData();
  function getGasUrl(){
    try {
      const qp = new URLSearchParams(location.search || '');
      const fromUrl = String(qp.get('gas') || '').trim();
      if (/^https:\/\/script\.google\.com\/macros\/s\/[^/?#]+\/exec$/i.test(fromUrl)) {
        sessionStorage.setItem('financebot_gas_url', fromUrl);
        return fromUrl;
      }
      const saved = String(sessionStorage.getItem('financebot_gas_url') || '').trim();
      if (/^https:\/\/script\.google\.com\/macros\/s\/[^/?#]+\/exec$/i.test(saved)) return saved;
    } catch(e) {}
    return '';
  }
  const GAS_URL = getGasUrl();
  const state = {data:null,page:'home',txFilter:'all',search:''};
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));

  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.enableClosingConfirmation(); } catch(e) {}
  }

  function vibrate(type){
    try { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(type || 'success'); } catch(e) {}
  }
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
  function money(n,c){
    try{return new Intl.NumberFormat('ru-RU',{style:'currency',currency:c||'RUB',maximumFractionDigits:2}).format(Number(n)||0)}
    catch(e){return (Number(n)||0).toLocaleString('ru-RU')+' '+(c||'')}
  }
  function pct(n){return (Number(n)||0).toFixed(0)+'%'}
  function monthName(key){const p=String(key).split('-'); const names=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек']; return names[(Number(p[1])||1)-1]||key;}

  const BANKS=[
    {id:'sber',name:'Сбербанк',aliases:['сбербанк','сбер','sber']},
    {id:'tbank',name:'Т-Банк',aliases:['т-банк','т банк','тинькофф','tinkoff','t-bank']},
    {id:'vtb',name:'ВТБ',aliases:['втб','vtb']},
    {id:'alfa',name:'Альфа-Банк',aliases:['альфа-банк','альфа банк','альфа','alfa']},
    {id:'gazprom',name:'Газпромбанк',aliases:['газпромбанк','гпб','gazprombank']},
    {id:'sovcom',name:'Совкомбанк',aliases:['совкомбанк','sovcom']},
    {id:'rshb',name:'Россельхозбанк',aliases:['россельхозбанк','рсхб','rshb']},
    {id:'psb',name:'ПСБ',aliases:['промсвязьбанк','псб','psb']},
    {id:'mkb',name:'МКБ',aliases:['московский кредитный банк','мкб','mkb']},
    {id:'raif',name:'Райффайзенбанк',aliases:['райффайзенбанк','райффайзен','raiffeisen']},
    {id:'pochta',name:'Почта Банк',aliases:['почта банк','почтабанк']},
    {id:'ozon',name:'Ozon Банк',aliases:['ozon банк','озон банк','ozon']},
    {id:'yandex',name:'Яндекс Банк',aliases:['яндекс банк','yandex bank']},
    {id:'other',name:'Другой',aliases:[]}
  ];
  function normBankText(s){return String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[–—]/g,'-');}
  function bankByText(text){
    const q=normBankText(text);
    return BANKS.find(b=>b.id!=='other'&&b.aliases.some(a=>q.includes(normBankText(a))))||BANKS[BANKS.length-1];
  }
  function accountNameById(id){const a=state.data&&state.data.accounts?state.data.accounts.find(x=>String(x.id)===String(id)):null;return a?String(a.name||''):''}
  function creditBank(cr){return bankByText((cr&&cr.name||'')+' '+accountNameById(cr&&cr.account_id));}
  function bankGlyph(id){
    switch(id){
      case 'sber': return '<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" d="M10 21c4-8 13-12 22-9M9 28c7 8 19 10 28 3M15 26l6 6 14-16"/></svg>';
      case 'tbank': return '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M10 10h28v8c0 12-5 19-14 23-9-4-14-11-14-23z" fill="#111"/><path d="M15 15h18v5h-6v14h-6V20h-6z" fill="#ffdd2d"/></svg>';
      case 'vtb': return '<svg viewBox="0 0 48 48" aria-hidden="true"><g fill="#fff"><path d="M8 16h21l-4 5H4z"/><path d="M14 23h21l-4 5H10z"/><path d="M20 30h20l-4 5H16z"/></g></svg>';
      case 'alfa': return '<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#fff" d="M24 9 34 36h-6l-2-6h-9l-2 6H9L19 9zm0 8-5 9h7z"/><rect x="10" y="39" width="28" height="3" rx="1.5" fill="#fff"/></svg>';
      case 'gazprom': return '<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#fff" d="M27 6c2 9-6 11-6 18 0 4 3 7 7 7 6 0 10-5 10-11 0-4-2-8-6-12 1 8-5 8-5 14 0 2 1 4 3 5-6-1-9-5-9-10 0-5 3-8 6-11Z"/><path d="M12 34h24v5H17v4h-5z" fill="#fff"/></svg>';

  function catIcon(c){
    c=String(c||'').toLowerCase();
    if(c.includes('продукт')||c.includes('еда'))return '🛒'; if(c.includes('авто'))return '🚗'; if(c.includes('дом'))return '🏠';
    if(c.includes('здоров'))return '💊'; if(c.includes('развлеч'))return '🎬'; if(c.includes('кредит'))return '💳';
    if(c.includes('зарплат'))return '💼'; if(c.includes('бизнес'))return '📈'; return '💸';

  function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2300)}
  function setLoading(on){$('#loader').style.display=on?'flex':'none'}
  function uuid(){return (Date.now().toString(36)+Math.random().toString(36).slice(2,10));}

  const bridgeState = {frame:null,ready:false,target:null,origin:'',channel:'',pending:new Map(),waiters:[]};
  function bridgeChannel(){
    if(bridgeState.channel) return bridgeState.channel;
    try{
      const a=new Uint8Array(16); crypto.getRandomValues(a);
      bridgeState.channel=Array.from(a,x=>x.toString(16).padStart(2,'0')).join('');
    }catch(e){ bridgeState.channel=uuid()+uuid(); }
    return bridgeState.channel;
  }
  function bridgeSrc(){
    if(!GAS_URL) return '';
    const sep=GAS_URL.includes('?')?'&':'?';
    return GAS_URL+sep+'bridge=1&channel='+encodeURIComponent(bridgeChannel());
  }
  function isGoogleBridgeOrigin(origin){
    try{
      const h=new URL(origin).hostname.toLowerCase();
      return h==='script.google.com' || h==='script.googleusercontent.com' || h.endsWith('.googleusercontent.com');
    }catch(e){ return false; }
  }
  function initBridge(){
    if(bridgeState.frame) return;
    const f=document.createElement('iframe');
    f.id='financebotBridge';
    f.setAttribute('aria-hidden','true');
    f.tabIndex=-1;
    f.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;border:0;left:-100px;top:-100px';
    f.src=bridgeSrc();
    bridgeState.frame=f;
    document.body.appendChild(f);
  }
  window.addEventListener('message',function(event){
    const msg=event.data||{};
    if(msg.channel!==bridgeState.channel) return;
    if(!isGoogleBridgeOrigin(event.origin)) return;
    if(msg.financebot_bridge==='ready'){
      bridgeState.target=event.source;
      bridgeState.origin=event.origin;
      bridgeState.ready=true;
      bridgeState.waiters.splice(0).forEach(x=>x.resolve(true));
      return;
    }
    if(msg.financebot_bridge==='response' && msg.id){
      if(!bridgeState.ready || event.source!==bridgeState.target || event.origin!==bridgeState.origin) return;
      const p=bridgeState.pending.get(String(msg.id));
      if(!p) return;
      bridgeState.pending.delete(String(msg.id));
      clearTimeout(p.timer);
      if(msg.ok) p.resolve(msg.data);
      else p.reject(new Error(msg.error||'Apps Script bridge error'));
    }
  });
  function waitBridge(){
    if(bridgeState.ready) return Promise.resolve(true);
    initBridge();
    return new Promise((resolve,reject)=>{
      const item={resolve,reject};
      bridgeState.waiters.push(item);
      setTimeout(()=>{
        const i=bridgeState.waiters.indexOf(item); if(i>=0) bridgeState.waiters.splice(i,1);
        if(!bridgeState.ready) reject(new Error('Не удалось подключиться к Google Apps Script. Обновите Bridge.html и новую версию Web App.'));
      },15000);
    });
  }
  async function call(method,args){
    args=args||[];
    if(!GAS_URL) throw new Error('Не найден адрес backend.');
    await waitBridge();
    const id=uuid();
    const payload=args.length>1?args[1]:null;
    return new Promise((resolve,reject)=>{
      const timer=setTimeout(()=>{bridgeState.pending.delete(id);reject(new Error('Apps Script timeout'));},25000);
      bridgeState.pending.set(id,{resolve,reject,timer});
      bridgeState.target.postMessage({
        financebot_bridge:'call',channel:bridgeState.channel,id:id,method:String(method||''),initData:String(args[0]||INIT_DATA||''),payload:payload
      },bridgeState.origin);
    });
  }
  async function api(method,payload){
    setLoading(true);
    try{
      const data=await call(method,[INIT_DATA].concat(payload===undefined?[]:[payload]));
      if(data&&data.summary){state.data=data;renderAll();}
      return data;
    }catch(e){toast(e.message);vibrate('error');throw e}finally{setLoading(false)}
  }

    if(!INIT_DATA){showFatal('Откройте приложение из Telegram','Telegram не передал данные запуска. Закройте это окно, вернитесь в чат с ботом и нажмите кнопку «Финансы» ещё раз.');return;}
    if(!GAS_URL){showFatal('Mini App не подключено','Не передан адрес Google Apps Script backend. В Google Sheets откройте Finance Bot → «Подключить Mini App (GitHub Pages)» и затем заново откройте кнопку «Финансы» в Telegram.');return;}
    try{
      const data=await call('miniBootstrap',[INIT_DATA]); state.data=data;
      $('#app').style.display='block'; $('#bottomNav').style.display='block';
      $('#hello').textContent='Финансы · '+data.summary.month;
      $('#username').textContent=data.user.first_name||('@'+data.user.username)||'FinanceBot';
      renderAll();
    }catch(e){showFatal('Не удалось открыть FinanceBot',e.message)}finally{setLoading(false)}
  }

  }
  function budgetModal(){const cats=state.data.expense_categories;openModal(`<div class="modal-head"><div class="modal-title">Бюджет на месяц</div><button class="close" data-close>✕</button></div><div class="field"><label>Категория</label><select id="bCat">${options(cats,cats[0])}</select></div><div class="field"><label>Лимит</label><input id="bLimit" inputmode="decimal" placeholder="30000"></div><button class="submit" id="saveBudget">Сохранить лимит</button>`);$('#saveBudget').onclick=async()=>{const limit=parseFloat($('#bLimit').value.replace(',','.'));if(!(limit>0)){toast('Введите лимит');return}const p={category:$('#bCat').value,limit};closeModal();await api('miniSaveBudget',p);toast('Бюджет сохранён')};}
  function accountModal(){openModal(`<div class="modal-head"><div class="modal-title">Новый счёт</div><button class="close" data-close>✕</button></div><div class="field"><label>Название</label><input id="aName" placeholder="Карта"></div><div class="field"><label>Начальный баланс</label><input id="aBalance" inputmode="decimal" value="0"></div><button class="submit" id="saveAccount">Добавить счёт</button>`);$('#saveAccount').onclick=async()=>{const name=$('#aName').value.trim();const balance=parseFloat($('#aBalance').value.replace(',','.'))||0;if(!name){toast('Введите название');return}closeModal();await api('miniAddAccount',{name,balance});toast('Счёт добавлен')};}
  function creditModal(){
    let selectedBank='other';
    openModal(`<div class="modal-head"><div class="modal-title">Новый кредит</div><button class="close" data-close>✕</button></div>
      <div class="field"><label>Банк</label>${bankPickerHtml(selectedBank)}</div>
      <div class="field"><label>Название кредита</label><input id="cName" placeholder="Например, ипотека"></div>
      <div class="row2"><div class="field"><label>Текущий долг</label><input id="cBal" inputmode="decimal"></div><div class="field"><label>Ставка, %</label><input id="cRate" inputmode="decimal"></div></div>
      <div class="row2"><div class="field"><label>Платёж</label><input id="cPay" inputmode="decimal"></div><div class="field"><label>День платежа</label><input id="cDay" inputmode="numeric" min="1" max="31"></div></div>
      <div class="field"><label>Счёт списания</label><select id="cAcc">${accountOptions()}</select></div><button class="submit" id="saveCredit">Добавить кредит</button>`);
    $$('#modal [data-bank]').forEach(btn=>btn.onclick=()=>{selectedBank=btn.dataset.bank;$$('#modal [data-bank]').forEach(x=>x.classList.toggle('selected',x.dataset.bank===selectedBank));vibrate('success')});
    $('#saveCredit').onclick=async()=>{
      const title=$('#cName').value.trim();
      const bank=BANKS.find(b=>b.id===selectedBank)||BANKS[BANKS.length-1];
      let name=title;
      if(bank.id!=='other'){const already=bank.aliases.some(a=>normBankText(title).includes(normBankText(a)));name=already?title:(bank.name+(title?' · '+title:''));}
      if(!name){toast('Выберите банк или введите название');return}
      const p={name,balance:parseFloat($('#cBal').value.replace(',','.')),rate:parseFloat($('#cRate').value.replace(',','.'))||0,payment:parseFloat($('#cPay').value.replace(',','.')),day:parseInt($('#cDay').value,10),accountId:$('#cAcc').value};
      closeModal();await api('miniAddCredit',p);toast('Кредит добавлен');
    };
  }
  function payCreditModal(id,type){const cr=state.data.credits.find(x=>x.id===id);if(!cr)return;openModal(`<div class="modal-head"><div class="modal-title">${type==='early'?'Досрочный платёж':'Платёж по кредиту'}</div><button class="close" data-close>✕</button></div><div class="card" style="margin-bottom:12px"><div class="title">${esc(cr.name)}</div><div class="sub">Остаток ${money(cr.balance,state.data.user.currency)}</div></div><div class="field"><label>Сумма</label><input id="pAmount" inputmode="decimal" value="${type==='early'?'':(cr.remaining_this_cycle||cr.payment)}"></div><button class="submit" id="savePay">Учесть платёж</button>`);$('#savePay').onclick=async()=>{const amount=parseFloat($('#pAmount').value.replace(',','.'));if(!(amount>0)){toast('Введите сумму');return}closeModal();await api('miniPayCredit',{creditId:id,paymentType:type,amount});toast('Платёж учтён')};}
  function recurringModal(){openModal(`<div class="modal-head"><div class="modal-title">Регулярная операция</div><button class="close" data-close>✕</button></div><div class="seg"><button class="active" id="recExpense">Расход</button><button id="recIncome">Доход</button></div><div class="field"><label>Сумма</label><input id="rAmount" inputmode="decimal"></div><div class="field"><label>Описание</label><input id="rDesc" placeholder="Интернет"></div><div class="field"><label>День месяца</label><input id="rDay" inputmode="numeric" min="1" max="31" placeholder="10"></div><button class="submit" id="saveRec">Добавить</button>`);let type='expense';$('#recExpense').onclick=()=>{type='expense';$('#recExpense').classList.add('active');$('#recIncome').classList.remove('active')};$('#recIncome').onclick=()=>{type='income';$('#recIncome').classList.add('active');$('#recExpense').classList.remove('active')};$('#saveRec').onclick=async()=>{const p={type,amount:parseFloat($('#rAmount').value.replace(',','.')),description:$('#rDesc').value.trim(),day:parseInt($('#rDay').value,10)};closeModal();await api('miniAddRecurring',p);toast('Регулярная операция добавлена')};}

  document.addEventListener('click',async e=>{
    const t=e.target.closest('button,[data-action],[data-navgo]'); if(!t)return;
    if(t.dataset.nav) return showPage(t.dataset.nav);
    if(t.dataset.navgo) return showPage(t.dataset.navgo);
    if(t.hasAttribute('data-close')) return closeModal();
    if(t.dataset.action==='add-expense') return transactionModal('expense');
    if(t.dataset.action==='add-income') return transactionModal('income');
    if(t.dataset.action==='add-budget') return budgetModal();
    if(t.dataset.action==='add-account') return accountModal();
    if(t.dataset.action==='add-credit') return creditModal();
    if(t.dataset.action==='add-recurring') return recurringModal();
    if(t.dataset.filter){state.txFilter=t.dataset.filter;renderOperations();return}
    if(t.dataset.payCredit) return payCreditModal(t.dataset.payCredit,t.dataset.payType||'normal');
    if(t.dataset.defaultAccount){await api('miniSetDefaultAccount',t.dataset.defaultAccount);toast('Основной счёт изменён');return}
    if(t.dataset.toggleRec){await api('miniToggleRecurring',t.dataset.toggleRec);return}
    if(t.dataset.delRec){if(confirm('Удалить регулярную операцию?'))await api('miniDeleteRecurring',t.dataset.delRec);return}
    if(t.dataset.delBudget){if(confirm('Удалить бюджет?'))await api('miniDeleteBudget',t.dataset.delBudget);return}
    if(t.dataset.delTx){if(confirm('Удалить эту операцию?')){await api('miniDeleteTransaction',t.dataset.delTx);toast('Операция удалена')}return}
  });
  $('#modalWrap').addEventListener('click',e=>{if(e.target.id==='modalWrap')closeModal()});
  $('#refreshBtn').addEventListener('click',async()=>{setLoading(true);try{state.data=await call('miniBootstrap',[INIT_DATA]);renderAll();toast('Обновлено')}catch(e){toast(e.message)}finally{setLoading(false)}});
  if(tg)tg.onEvent('themeChanged',()=>renderAll());
  load();
})();
</script>
</body>
</html>
